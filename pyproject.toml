[build-system]
requires = ["setuptools>=81.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dataroom-organizer"
version = "0.1.0"
description = "AI-assisted static data room document organizer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.7",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.2",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "xlrd>=2.0.2",
    "pytesseract>=0.3.13",
    "Pillow>=10.4.0",
    "pdf2image>=1.17.0",
    "extract-msg>=0.48.0",
    "numpy>=1.26.0,<3.0.0",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.3.0",
    "torch>=2.2.0",
    "transformers>=5.0.0",
    "huggingface-hub>=0.23.0",
    "openai>=1.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
windows = ["pywin32>=306"]
ui = ["streamlit>=1.40.0", "pandas>=2.0.0"]

[project.scripts]
dataroom = "dataroom.cli:main"
dataroom-ui = "dataroom.ui.launch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
