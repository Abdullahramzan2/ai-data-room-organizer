[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dataroom-organizer"
version = "0.1.0"
description = "AI-assisted static data room document organizer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF>=1.24.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "xlrd>=2.0.1",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "pdf2image>=1.17.0",
    "extract-msg>=0.48.0",
    "PyYAML>=6.0.1",
    "python-dateutil>=2.9.0",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0,<3.0.0",
    "torch>=2.0.0",
    "transformers>=4.41.0",
    "huggingface-hub>=0.23.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "openai>=1.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
windows = ["pywin32>=306"]

[project.scripts]
dataroom = "dataroom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
