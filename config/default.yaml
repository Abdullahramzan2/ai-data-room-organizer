# Data Room Organizer — default application config

input:
  recursive: true
  # Extensions processed by the ingestion pipeline (lowercase, with dot)
  supported_extensions:
    - .pdf
    - .doc
    - .docx
    - .xls
    - .xlsx
    - .ppt
    - .pptx
    - .jpg
    - .jpeg
    - .png
    - .tif
    - .tiff
    - .txt
    - .msg
    - .eml
    - .kml
    - .kmz
    - .geojson
    - .gpx
    - .dxf
    - .dwg

ocr:
  enabled: true
  # Minimum native text chars before OCR is triggered on PDFs/images
  min_native_text_chars: 50
  # Cap OCR on very large scanned PDFs (0 = OCR every page)
  max_pdf_ocr_pages: 200
  # Tesseract language(s); install data packs as needed
  language: eng
  # DPI for rendering PDF pages before OCR
  pdf_dpi: 300
  # Path to tesseract binary (null = auto-detect PATH or common Windows install)
  tesseract_cmd: null
  # Poppler bin folder for PDF OCR (null = auto-detect PATH or common Windows install)
  poppler_path: null

ingestion:
  # Max characters stored per document (downstream classification uses excerpts)
  max_text_chars: 2000000
  # Skip files larger than this (bytes); 0 = no limit
  max_file_size_bytes: 0

legacy_office:
  # Path to LibreOffice soffice binary (null = auto-detect on PATH or common Windows paths)
  libreoffice_cmd: null
  # Use Microsoft Word/PowerPoint COM automation on Windows when available
  enable_com: true
  # Seconds to wait for conversion subprocesses
  conversion_timeout: 120

classification:
  excerpt_chars: 4000
  high_threshold: 0.75
  medium_threshold: 0.50
  keyword_weight: 0.3
  embedding_weight: 0.7
  embedding_model: all-MiniLM-L6-v2
  llm_excerpt_chars: 3000
  top_candidates: 3
  # Parallel Tier-3 / post-embedding classification workers (1 = sequential)
  max_workers: 4
  # Reasoning provider for Tier 3: auto | local | openai | ollama | enterprise
  reasoning_provider: auto
  # Provider priority when reasoning_provider=auto (first available wins)
  auto_provider_chain:
    - enterprise
    - openai
    - ollama
    - local

# Enterprise / private LLM (OpenAI-compatible API) — secrets in .env
# ENTERPRISE_API_KEY, ENTERPRISE_BASE_URL, ENTERPRISE_MODEL, ENTERPRISE_TIMEOUT, ENTERPRISE_EXTRA_HEADERS

# Guardrails — control external API usage and audit decisions
guardrails:
  # Allow escalation to non-trusted-host endpoints. When false, only trusted-local providers apply.
  allow_external_api: true
  # Max characters of extracted text sent to an external provider per file
  max_external_chars: 3000
  # Extensions that must never escalate to Tier 3 (always local-only)
  local_only_extensions:
    - .dwg
    - .dxf
    - .kmz
    - .kml
    - .geojson
    - .gpx
  # Parent folder name fragments that force local-only (case-insensitive substring)
  local_only_folders: []
  # Only escalate when local combined score is below this threshold
  escalation_confidence_threshold: 0.50
  # Estimated max USD spend on external API calls per pipeline run (0 = unlimited)
  max_api_cost_per_run_usd: 2.0
  # Action when classification remains uncertain: needs_review
  uncertain_action: needs_review
  # Write audit log entries for every escalation decision
  audit_log_enabled: true
  # Hostnames treated as local for external-call guardrails (Ollama on localhost, etc.)
  trusted_local_hosts:
    - localhost
    - 127.0.0.1
    - ::1
  # Optional provider filters (empty allow_list = all registered providers allowed)
  provider_allow_list: []
  provider_block_list: []

duplicates:
  enabled: true
  hash_algorithm: sha256
  near_similarity_threshold: 0.92
  min_text_chars_for_near: 100
  max_near_pairs: 50000
  flag_for_review: true

corrections:
  review_queue_corrected_folder_column: corrected_folder

paths:
  taxonomy_file: taxonomy/real_estate_development.yaml
  cache_dir: output/.cache

output:
  naming_mode: preserve
  manifest_file: manifest.xlsx
  review_queue_file: review_queue.xlsx
  errors_report_file: errors_report.xlsx
  duplicate_report_file: duplicate_report.xlsx
  index_html_file: index.html
  index_link_mode: original
  persist_ingestion_cache: true
  ingestion_cache_file: ingestion_cache.json
  classification_cache_file: classification_cache.json
  classification_log_file: classification_log.xlsx
  processing_log_file: processing_log.json
  progress_file: run_progress.json
  admin_folder: "00_Admin_and_Index"
  source_auth_matrix_file: source_authentication_matrix.xlsx
  # When false (default), Carl admin deliverables live only under 00_Admin_and_Index.
  keep_admin_artifacts_at_root: false
